services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craftandboard
    ports:
      - "5432:5432"
    volumes:
      - craftandboard-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - craftandboard-redis:/data

volumes:
  craftandboard-postgres:
  craftandboard-redis:
